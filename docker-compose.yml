services:
  db:
    image: mysql:8.0
    container_name: meta_billing_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-meta_billing}
      MYSQL_USER: ${MYSQL_USER:-meta_billing}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD en .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en .env}
    ports:
      # Solo accesible desde la propia máquina (la API se conecta por localhost).
      - '127.0.0.1:${MYSQL_PORT:-3309}:3306'
    volumes:
      - meta_billing_datos:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  meta_billing_datos:
